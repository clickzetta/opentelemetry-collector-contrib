# OpenTelemetry Collector configuration for API Key Gateway mode.
# Tenants are identified by the x-api-key header in incoming OTLP requests.
# The gateway validates keys against an external Key Service and routes
# telemetry to the appropriate ClickZetta Lakehouse backend.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  batch:
    timeout: 1m
    send_batch_size: 8192
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  clickzetta:
    # API Key Gateway mode — enabled by setting apikey_service_url.
    apikey_service_url: ${env:APIKEY_SERVICE_URL}
    apikey_header: x-api-key
    router_mode: mock
    cache_ttl: 5m
    create_schema: true
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickzetta]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickzetta]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickzetta]
