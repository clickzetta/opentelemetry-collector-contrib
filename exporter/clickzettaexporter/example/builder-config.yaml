dist:
  name: otelcol-clickzetta
  description: Custom OpenTelemetry Collector with ClickZetta exporter
  version: 0.151.0-dev
  output_path: ./cmd/otelcontribcol

# You can add more receivers, processors, exporters, and extensions as needed for your custom collector.

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.151.1-0.20260501001745-24aecacf1c04

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.151.1-0.20260501001745-24aecacf1c04
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.151.1-0.20260501001745-24aecacf1c04

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.151.1-0.20260501001745-24aecacf1c04
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.151.1-0.20260501001745-24aecacf1c04
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.151.1-0.20260501001745-24aecacf1c04
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickzettaexporter v0.151.0

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.151.1-0.20260501001745-24aecacf1c04

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickzettaexporter => ../../exporter/clickzettaexporter
